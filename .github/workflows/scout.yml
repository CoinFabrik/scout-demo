name: scout-audit
on:
  pull_request:
    branches:
      - main

jobs:
  scout-audit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      repository-projects: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Run scout
        id: scout
        uses: ./.github/actions
        with:
          working_directory: .
          fail_on_error: false
          comment_pr: false

      - name: Display Report
        if: always()
        run: |
          if [[ -n "${{ steps.scout.outputs.report }}" ]]; then
            cat "${{ steps.scout.outputs.report }}"
          fi
