name: scout-audit
on:
  pull_request:
    branches:
      - main

jobs:
  scout-audit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      repository-projects: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Run scout
        id: scout
        uses: ./.github/actions
        with:
          working_directory: .
          fail_on_error: false
          comment_pr: false

      - name: Display Report
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/report.md" ]; then
            cat "${{ github.workspace }}/report.md"
          else
            echo "::warning::No report file was generated at ${{ github.workspace }}/report.md"
            echo "Checking scout-report directory contents:"
            ls -la "${{ github.workspace }}/scout-report" || echo "scout-report directory not found"
          fi
