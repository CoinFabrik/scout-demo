name: scout-audit
on:
  pull_request:
    branches:
      - main

jobs:
  scout-audit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      repository-projects: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: do scout
        uses: ./.github/actions
        with:
          working_directory: .
          verbose: false
          fail_on_error: false
          comment_pr: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
