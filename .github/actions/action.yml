name: Run Scout-action
description: Run scout-action
author: Coinfabrik

inputs:
  working_directory:
    description: Folder to scan for Cargo.toml
    required: false
    default: "."
  verbose:
    description: Whether to run scout in verbose mode
    required: false
    default: true
  fail_on_error:
    description: Whether to fail the action if Scout finds issues
    required: false
    default: true
  comment_pr:
    description: Whether to prepare the report for PR commenting
    required: false
    default: true
  github_token:
    description: GitHub token (needed if comment-pr is true)
    required: false
  scout_extra_args:
    description: Scout extra args
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run scout analysis
      shell: bash
      run: |
        # Function for logging
        log() {
          echo "[INFO] $1"
        }

        # Set Docker quiet flag based on verbose input
        DOCKER_QUIET=${{ inputs.verbose == 'true' && '' || '--quiet' }}

        # Build the Docker image
        log "Building Scout Docker image..."
        cd ${{ github.action_path }}
        docker build $DOCKER_QUIET -t scout-action . > /dev/null 2>&1

        # Prepare output directory
        log "Preparing workspace..."
        mkdir -p ${{ github.workspace }}/scout-report

        # Run Scout analysis
        log "Running Scout analysis..."
        docker run $DOCKER_QUIET \
          -v ${{ github.workspace }}:/scoutme \
          -v ${{ github.workspace }}/scout-report:/output \
          -w /scoutme \
          -e INPUT_TARGET="${{ inputs.working_directory }}" \
          -e INPUT_SCOUT_ARGS=" ${{ inputs.verbose == 'true' && '-v' || '' }} ${{ inputs.comment_pr == 'true' && '--output-format md-gh --output-path /output/report.md' || '' }} --cicd /output ${{ inputs.scout_extra_args }}" \
          scout-action

        # Handle report file
        if [ -f "${{ github.workspace }}/scout-report/report.md" ]; then
          log "Copying Scout report..."
          cp ${{ github.workspace }}/scout-report/report.md ${{ github.workspace }}/report.md
        fi

    - name: Comment on PR
      if: ${{ inputs.comment_pr == 'true' }}
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        token: ${{ inputs.github_token }}
        body-path: ${{ github.workspace }}/report.md

    - name: Fail on error
      if: ${{ inputs.fail_on_error == 'true' }}
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/scout-report/FAIL" ]; then
          echo "[ERROR] Scout found issues."
          exit 1
        fi