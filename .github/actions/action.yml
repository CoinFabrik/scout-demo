name: Run Scout-action
description: Run scout-action
author: Coinfabrik

# Define your inputs here.
inputs:
  working_directory:
    description: Folder to scan for Cargo.toml
    required: false
    default: "."
  verbose:
    description: Whether to run scout in verbose mode
    required: false
    default: true
  fail_on_error:
    description: Whether to fail the action if Scout finds issues
    required: false
    default: true
  comment_pr:
    description: Whether to prepare the report for PR commenting
    required: false
    default: true
  github_token:
    description: GitHub token (needed if comment-pr is true)
    required: false
  scout_extra_args:
    description: Scout extra args
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run scout analysis
      shell: bash
      run: |
        # Build the Docker image from the action directory
        cd ${{ github.action_path }}
        docker build -t scout-action .

        # Go back to the workspace root to run the container
        cd ${{ github.workspace }}
        pwd
        ls -la

        cd ${{ inputs.working_directory }}
        pwd
        ls -la

        # Run the container with the workspace mounted
        docker run \
          -v ${{ github.workspace }}:/scoutme \
          -w /scoutme \
          -e INPUT_TARGET="${{ inputs.working_directory }}" \
          -e INPUT_SCOUT_ARGS=" ${{ inputs.verbose == 'true' && '-v' || '' }} ${{ inputs.comment_pr == 'true' && '--output-format md-gh --output-path ${{ github.workspace }}/report.md' || '' }} --cicd /github/workspace ${{ inputs.scout_extra_args }}" \
          scout-action

    - name: Comment on PR
      if: ${{ inputs.comment_pr == 'true' }}
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        token: ${{ inputs.github_token }}
        body-path: ${{ github.workspace }}/report.md

    - name: Fail on error
      if: ${{ inputs.fail_on_error == 'true' }}
      shell: bash
      run: |
        if [ -f "/github/workspace/FAIL" ]; then
          echo "Error: Scout found issues."
          exit 1
        fi
